<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024px" height="1024px" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Oval</title>
    <!--
      Netegram: fills the whole canvas instead of the circle that used to sit inside it.
      iOS applies its own rounded-square mask to an app icon, so artwork that stops short of
      the edges reads as a shape floating on the icon rather than as the icon.
    -->
    <g id="Oval" stroke="none" fill="none" fill-rule="nonzero">
        <rect fill="#000000" x="0" y="0" width="1024" height="1024"></rect>
    </g>
</svg>
